<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Remote LAN</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="light">
  <div class="appFrame">
    <aside class="sidebar">
      <div class="sidebarChrome"></div>

      <section class="sideGroup">
        <div class="sideTitle">
          <svg class="sideIcon" aria-hidden="true"><use href="assets/icons.svg#icon-devices"></use></svg>
          <span>我的设备</span>
        </div>
        <div id="deviceList" class="deviceList"></div>
      </section>

      <section class="sideGroup">
        <div class="sideTitle">
          <svg class="sideIcon" aria-hidden="true"><use href="assets/icons.svg#icon-lan"></use></svg>
          <span>局域网</span>
        </div>
        <button id="refreshDevices" class="sideItem plain">刷新设备</button>
      </section>

      <section class="sideGroup">
        <div class="sideTitle">
          <svg class="sideIcon" aria-hidden="true"><use href="assets/icons.svg#icon-reset"></use></svg>
          <span>设置</span>
        </div>
        <label class="sideSetting">
          <span>连接模式</span>
          <select id="connectionMode">
            <option value="webrtc">稳定 WebRTC</option>
            <option value="native-v2">Native v2 极限</option>
          </select>
        </label>
      </section>

      <section class="sideGroup">
        <div class="sideTitle">
          <svg class="sideIcon" aria-hidden="true"><use href="assets/icons.svg#icon-computer"></use></svg>
          <span>本机</span>
        </div>
        <div class="localCard">
          <div class="small">本机 PIN</div>
          <div id="localPin" class="localPin">------</div>
          <div id="localAddr" class="small"></div>
        </div>
      </section>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="topTitle">
          <button class="iconBtn" disabled aria-label="后退"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chevron-left"></use></svg></button>
          <button class="iconBtn" disabled aria-label="前进"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chevron-right"></use></svg></button>
          <span id="selectedStatus" class="pill muted">等待设备</span>
          <h1 id="selectedName">P2P Remote LAN</h1>
        </div>
        <div class="topActions">
          <button id="refreshTop" class="iconBtn" title="刷新" aria-label="刷新"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-refresh"></use></svg></button>
          <button id="openScreenSettings" class="iconBtn" title="屏幕录制权限" aria-label="屏幕录制权限"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-record"></use></svg></button>
          <button id="resetScreenPermission" class="iconBtn" title="重置屏幕录制权限" aria-label="重置屏幕录制权限"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-reset"></use></svg></button>
        </div>
      </header>

      <section class="content">
        <div id="heroCard" class="remoteHero empty">
          <div class="heroPreview">
            <img id="previewImage" class="devicePreviewImage" src="assets/device-win.png" alt="" />
            <button id="enterDesktop" class="enterDesktop" disabled><span>进入桌面</span><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-arrow-right"></use></svg></button>
          </div>
          <div class="heroActions">
            <button id="connectSelected" class="heroAction" disabled><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-monitor-play"></use></svg><span>远程桌面</span></button>
            <span class="divider"></span>
            <button class="heroAction" disabled><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-more"></use></svg><span>更多</span></button>
          </div>
        </div>

        <h2>快速启动</h2>
        <div id="quickGrid" class="quickGrid">
          <button id="manualAdd" class="quickAdd"><svg class="quickIcon" aria-hidden="true"><use href="assets/icons.svg#icon-plus"></use></svg><span>手动连接</span></button>
          <div class="nativeHint">
            <b>Native v2 极限链路</b>
            <span id="nativeV2StatusText">正在检测 native-v2...</span>
            <code>TCP 45000 视频 / UDP 45001 输入，推荐 1080p60</code>
          </div>
        </div>

        <details class="diagnostics">
          <summary>连接日志</summary>
          <pre id="log" class="log lightLog"></pre>
        </details>
      </section>
    </main>
  </div>
  <script src="webrtc-host-controller.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
