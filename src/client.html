<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Remote LAN - Client</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <section class="header">
      <div>
        <h1 class="title">Windows 控制端</h1>
        <p class="subtitle">连接 Mac 主机后，点击画面即可发送鼠标/键盘输入。</p>
      </div>
      <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">未连接</span></div>
    </section>

    <section class="card" style="margin-bottom: 16px;">
      <div class="form">
        <label>Mac IP / Host
          <input id="host" placeholder="例如 192.168.1.23" autocomplete="off" />
        </label>
        <label>端口
          <input id="port" value="7777" inputmode="numeric" />
        </label>
        <label>PIN
          <input id="pin" placeholder="6 位" inputmode="numeric" maxlength="8" />
        </label>
        <button id="connect">连接</button>
      </div>
      <p class="small">视频走 WebRTC 直连；信令只在 Mac 主机内置 WebSocket 上中转。键鼠事件走 unordered / unretransmitted DataChannel，优先低延迟。</p>
    </section>

    <section class="grid" style="grid-template-columns: minmax(0, 1fr) 330px;">
      <div class="videoWrap">
        <video id="remoteVideo" autoplay playsinline muted tabindex="0"></video>
        <div id="overlay" class="overlay">等待视频流<br /><span class="small">连接后请点击画面使键盘输入聚焦</span></div>
      </div>
      <div class="card">
        <h3 style="margin-top: 0;">连接日志</h3>
        <pre id="log" class="log"></pre>
      </div>
    </section>
  </main>
  <script src="client.js"></script>
</body>
</html>
